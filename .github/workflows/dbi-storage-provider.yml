name: DBI storage provider integration

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/ci_backend_smoke.py"
      - ".github/scripts/ci_dbi_storage_*.py"
      - ".github/scripts/ci_dbi_storage_provider_digest.sh"
      - ".github/scripts/ci_dbi_storage_provider_bootstrap.sh"
      - ".github/workflows/dbi-storage-provider.yml"
      - "apps/platform-web/backend/app/dbi/storage_*.py"
      - "apps/platform-web/backend/requirements.txt"
      - "docs/36_DBI_STORAGE_DESIGN_DBI-STORAGE-001.md"
      - "docs/37_DBI_STORAGE_PROVIDER_GATE_DBI-STORAGE-001.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-storage-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-boundary:
    name: DBI storage · SeaweedFS efímero y privado
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Verificar scripts
        run: |
          bash -n .github/scripts/ci_dbi_storage_provider_digest.sh
          bash -n .github/scripts/ci_dbi_storage_provider_bootstrap.sh

      - name: Validar digest inmutable
        id: provider
        run: bash .github/scripts/ci_dbi_storage_provider_digest.sh

      - name: Ejecutar proveedor efímero endurecido
        run: >-
          bash .github/scripts/ci_dbi_storage_provider_bootstrap.sh
          "${{ steps.provider.outputs.pinned_ref }}"
