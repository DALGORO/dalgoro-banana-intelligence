name: DBI campaign integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-campaign-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign-contracts:
    name: DBI · Campaign scoped, idempotente y sin tocar density
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/platform-web/backend/requirements.txt

      - name: Instalar dependencias backend
        run: python -m pip install -r apps/platform-web/backend/requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar dominio Campaign
        run: |
          python -m compileall -q apps/platform-web/backend/app/dbi/campaigns
          python -m py_compile apps/platform-web/backend/app/dbi/models/agriculture.py
          python -m py_compile apps/platform-web/backend/app/api/v1/dbi_campaigns.py
          python -m py_compile apps/platform-web/backend/dbi_alembic/versions/20260908_19_campaign_domain.py
          python -m py_compile .github/scripts/ci_dbi_campaigns.py
          python -m py_compile .github/scripts/ci_dbi_density_campaign_ui.py

      - name: Validar contratos, lifecycle, scope y aislamiento density
        env:
          PYTHONPATH: apps/platform-web/backend
        run: python .github/scripts/ci_dbi_campaigns.py

      - name: Validar trazabilidad visual Density a Campaign
        run: python .github/scripts/ci_dbi_density_campaign_ui.py
