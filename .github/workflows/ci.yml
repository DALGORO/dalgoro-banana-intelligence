name: CI modular

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repositorio · higiene de artefactos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validar fuentes canónicas y activos preservados
        run: python .github/scripts/ci_repository_hygiene.py

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform-web/frontend
    env:
      VITE_API_URL: http://localhost:8000
      VITE_ENABLE_DOCS: "false"

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform-web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar lint sin aumentar la línea base
        run: npm run lint -- --max-warnings 115

      - name: Compilar frontend
        run: npm run build

      - name: Auditar dependencias de producción
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  backend:
    name: Backend · instalación y healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/platform-web/backend

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/platform-web/backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar backend y migraciones
        run: python -m compileall app alembic dbi_alembic

      - name: Validar grafos Alembic sin ejecutar migraciones
        run: |
          alembic heads
          alembic -c dbi_alembic.ini heads

      - name: Validar aislamiento DBI y SQL offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_database_isolation.py

      - name: Validar controles de migración DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_migration_control.py

      - name: Validar advisory lock de migración DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_migration_lock.py

      - name: Validar orquestador cerrado de apply DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_migration_apply.py

      - name: Validar adaptador Alembic DBI externo offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_migration_runner.py

      - name: Validar fábrica de sesiones DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_session_factory.py

      - name: Validar repositorios DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_repositories.py

      - name: Validar autorización DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_authorization.py

      - name: Validar política administrativa DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_policy.py

      - name: Validar repositorio administrativo DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_repository.py

      - name: Validar jerarquía administrativa DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_scope_hierarchy.py

      - name: Validar estado administrativo DBI versionado offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_state.py

      - name: Validar plan puro de mutación administrativa DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_mutation_plan.py

      - name: Validar planes puros de altas administrativas DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_creation_plan.py

      - name: Validar persistencia idempotente de altas DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_creation_persistence.py

      - name: Validar servicio de altas administrativas DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_creation_service.py

      - name: Validar auditoría administrativa DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_audit.py

      - name: Validar persistencia administrativa DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_persistence.py

      - name: Validar guardas y mutaciones administrativas DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_admin_service.py

      - name: Validar identidad y membresías DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_identity.py

      - name: Validar ciclo de vida DBI en FastAPI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_fastapi_lifecycle.py

      - name: Validar consultas DBI autorizadas offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_authorized_reads.py

      - name: Validar escrituras DBI autorizadas offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_authorized_writes.py

      - name: Validar geometrías y consultas espaciales DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_spatial.py

      - name: Validar dominio agrícola DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_domain.py

      - name: Validar contrato de mapa cronológico
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_map_contract.py

      - name: Validar contrato de trabajo geoespacial
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_analysis_job_contract.py

      - name: Validar contratos e idempotencia del servicio de trabajos
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_analysis_job_service_contracts.py

      - name: Validar persistencia de trabajos geoespaciales
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_analysis_job_persistence.py

      - name: Validar persistencia de activos y artefactos
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_asset_persistence.py

      - name: Ejecutar importación y healthcheck
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_backend_smoke.py

      - name: Auditar dependencias instaladas
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local

  whatsapp-bot:
    name: WhatsApp · instalación y smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/whatsapp-bot

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/whatsapp-bot/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar bot
        run: python -m compileall .

      - name: Ejecutar importación y endpoint local
        env:
          PYTHONPATH: .
        run: python ../../.github/scripts/ci_whatsapp_smoke.py

      - name: Auditar dependencias instaladas
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local

  banana-density:
    name: Densidad · instalación geoespacial y smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/banana-density

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/banana-density/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar motor geoespacial
        run: python -m compileall src main.py

      - name: Ejecutar importaciones y validar CLI
        env:
          PYTHONPATH: src
        run: python ../../.github/scripts/ci_density_smoke.py

      - name: Auditar dependencias instaladas
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local

  secrets:
    name: Seguridad · detectar secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar historial completo
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks CLI verificado
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

          curl --fail --location --silent --show-error \
            "${GITLEAKS_URL}" \
            --output "/tmp/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' \
            "${EXPECTED_SHA256}" "/tmp/${GITLEAKS_ARCHIVE}" \
            | sha256sum --check --strict -
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/${GITLEAKS_ARCHIVE}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Analizar historial completo con Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git \
            --redact=100 \
            --no-banner \
            --verbose \
            .
