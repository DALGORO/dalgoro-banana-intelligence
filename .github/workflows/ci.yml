  secrets:
    name: Seguridad · detectar secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar historial completo
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks CLI verificado
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

          curl --fail --location --silent --show-error \
            "${GITLEAKS_URL}" \
            --output "/tmp/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' \
            "${EXPECTED_SHA256}" "/tmp/${GITLEAKS_ARCHIVE}" \
            | sha256sum --check --strict -
          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/${GITLEAKS_ARCHIVE}" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Analizar historial completo con Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git \
            --redact=100 \
            --no-banner \
            --verbose \
            .


  portal-gis-worker:
    name: GIS · instalación mínima S3/PostGIS y conversión controlada
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/banana-density

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/banana-density/requirements-gis-worker.txt

      - name: Instalar worker sin YOLO
        run: python -m pip install -r requirements-gis-worker.txt

      - name: Verificar coherencia de dependencias GIS
        run: python -m pip check

      - name: Validar seguridad del worker S3 sin conexiones
        run: python ../../.github/scripts/ci_dbi_gis_s3_worker.py

      - name: Convertir SHP y GeoPackage sintéticos
        run: python ../../.github/scripts/ci_portal_gis_converter.py
