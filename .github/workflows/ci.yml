name: CI básica

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-syntax:
    name: Validar sintaxis Python
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar módulos Python
        run: |
          python -m compileall \
            apps/platform-web/backend/app \
            apps/whatsapp-bot \
            services/banana-density/src \
            services/banana-density/main.py

  frontend-build:
    name: Compilar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-web/frontend
    env:
      VITE_API_URL: http://localhost:8000
      VITE_ENABLE_DOCS: "false"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/platform-web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
