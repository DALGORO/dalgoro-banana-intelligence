name: CI modular

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repositorio · higiene de artefactos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validar fuentes canónicas y activos preservados
        run: python .github/scripts/ci_repository_hygiene.py

  h14-minio-real:
    name: H14 · MinIO real local sin grants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/platform-web/backend/requirements.txt

      - name: Instalar cliente S3 y contratos DBI del backend
        run: python -m pip install -r apps/platform-web/backend/requirements.txt

      - name: Descargar binario oficial MinIO y verificar SHA256
        run: |
          set -euo pipefail
          BASE="https://dl.min.io/server/minio/release/linux-amd64/archive"
          RELEASE="minio.RELEASE.2025-09-07T16-13-09Z"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 180 \
            "$BASE/$RELEASE" --output "$RUNNER_TEMP/minio"
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 30 \
            "$BASE/$RELEASE.sha256sum" --output "$RUNNER_TEMP/minio.sha256sum"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/minio.sha256sum")"
          [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s  %s\\n' "$expected" "$RUNNER_TEMP/minio" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/minio"

      - name: Levantar MinIO local descartable sin Docker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h14-minio-data"
          MINIO_ROOT_USER=dbi_h14_ci_root \
          MINIO_ROOT_PASSWORD=dbi_h14_ci_only_secret_987654321 \
            nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/h14-minio-data" \
              --address "127.0.0.1:9000" \
              > "$RUNNER_TEMP/h14-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/h14-minio.pid"

      - name: Ensayar cargas incompletas reales, listados exactos y abortos
        env:
          DBI_MINIO_E2E_ENABLED: "1"
          DBI_MINIO_E2E_ENDPOINT: "http://127.0.0.1:9000"
          DBI_MINIO_E2E_ACCESS_KEY: dbi_h14_ci_root
          DBI_MINIO_E2E_SECRET_KEY: dbi_h14_ci_only_secret_987654321
        run: python .github/scripts/ci_dbi_scientific_minio_real.py

      - name: Detener MinIO efímero
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/h14-minio.pid"; then
            kill "$(cat "$RUNNER_TEMP/h14-minio.pid")" || true
          fi

  frontend:
    name: Frontend · lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform-web/frontend
    env:
      VITE_API_URL: http://localhost:8000
      VITE_ENABLE_DOCS: "false"

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform-web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar lint sin aumentar la línea base
        run: npm run lint -- --max-warnings 115

      - name: Validar historial multiespectral solo con Campaign verificada
        run: node --test tests/multispectralCampaignHistory.test.mjs

      - name: Validar contrato visual DBI sin resultados ficticios
        run: node --test tests/dbiClientVisualLayout.test.mjs

      - name: Validar inventario local de dos carpetas (sin publicar)
        run: node --test tests/analysisFolderInventory.test.mjs

      - name: Validar plan y carga GIS privada desde carpeta 1
        run: node --test tests/privateGISUploadPlan.test.mjs

      - name: Validar borrador de preparación de dos carpetas científicas
        run: node --test tests/scientificReceptionDraft.test.mjs

      - name: Validar interfaz de vinculación científica por Campaign sin subir archivos
        run: node --test tests/scientificScopePreflightUI.test.mjs

      - name: Validar búsqueda exacta de fincas y lotes autorizados
        run: node --test tests/clientPortalSearch.test.mjs

      - name: Validar recorrido de entrada al mapa del cliente
        run: node --test tests/clientMapEntry.test.mjs

      - name: Validar acciones rápidas GIS junto al mapa del cliente
        run: node --test tests/clientMapQuickActions.test.mjs

      - name: Compilar frontend
        run: npm run build

      - name: Auditar dependencias de producción
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  backend:
    name: Backend · instalación y healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/platform-web/backend

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/platform-web/backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar backend y migraciones
        run: python -m compileall app alembic dbi_alembic

      - name: Validar grafos Alembic sin ejecutar migraciones
        run: |
          alembic heads
          alembic -c dbi_alembic.ini heads

      - name: Validar aislamiento DBI y SQL offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_database_isolation.py

      - name: Validar controles de migración DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_migration_control.py

      - name: Validar advisory lock de migración DBI offline
        env:
          PYTHONPATH: .
        run: python ../../../.github/scripts/ci_dbi_migration_lock.py

      - name: Validar orquestador cerrado de apply DBI offline
