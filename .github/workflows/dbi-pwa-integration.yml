name: DBI PWA integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa-contracts:
    name: DBI · PWA offline, Sampling y seguridad de caché
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform-web/frontend
    env:
      VITE_API_URL: http://localhost:8000
      VITE_ENABLE_DOCS: "false"

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Validar contrato estático PWA
        working-directory: .
        run: python .github/scripts/ci_dbi_pwa.py

      - name: Configurar Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform-web/frontend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Validar lint sin aumentar línea base
        run: npm run lint -- --max-warnings 115

      - name: Compilar PWA/frontend
        run: npm run build
