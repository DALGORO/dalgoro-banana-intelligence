name: DBI raster integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-raster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-cog:
    name: DBI · COG sintético RGB y científico
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/banana-density/requirements.txt

      - name: Instalar Rasterio controlado
        run: python -m pip install rasterio==1.4.4

      - name: Compilar frontera Raster
        run: |
          python -m py_compile services/banana-density/src/banana_analyzer/raster_cog.py
          python -m py_compile services/banana-density/flight_test_cog.py
          python -m py_compile apps/platform-web/backend/app/dbi/raster/contracts.py
          python -m py_compile apps/platform-web/backend/app/dbi/raster/manifest.py
          python -m py_compile apps/platform-web/backend/app/dbi/raster/repository.py
          python -m py_compile apps/platform-web/backend/app/dbi/raster/service.py
          python -m py_compile .github/scripts/ci_dbi_raster_cog.py
          python -m py_compile .github/scripts/ci_dbi_raster_contracts.py

      - name: Validar contratos Raster offline
        run: python .github/scripts/ci_dbi_raster_contracts.py

      - name: Validar COG sintético real
        run: python .github/scripts/ci_dbi_raster_cog.py

      - name: Validar CLI de primera ortofoto
        run: python services/banana-density/flight_test_cog.py --help

  raster-postgis:
    name: DBI · producto COG en PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgis:
        image: postgis/postgis:16-3.5@sha256:4be58fcb1b50df187e73536e663149c2b3b2da2a541c2f518cfb6adebc65ed91
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/platform-web/backend/requirements.txt

      - name: Instalar dependencias backend
        run: python -m pip install -r apps/platform-web/backend/requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar Raster y migración
        run: |
          python -m compileall -q apps/platform-web/backend/app/dbi/raster
          python -m py_compile apps/platform-web/backend/app/dbi/models/raster_products.py
          python -m py_compile apps/platform-web/backend/dbi_alembic/versions/20260903_15_raster_products.py
          python -m py_compile .github/scripts/ci_dbi_raster_integration.py

      - name: Aplicar migraciones en PostGIS efímero
        env:
          PYTHONPATH: apps/platform-web/backend
          DBI_ENVIRONMENT: test
          DBI_DATABASE_URL: postgresql+psycopg://dbi_test_migrator@127.0.0.1:5432/dbi_test
        run: python .github/scripts/ci_dbi_migration_integration.py

      - name: Validar COG privado con rol Raster mínimo
        env:
          PYTHONPATH: apps/platform-web/backend:.github/scripts
          DBI_ENVIRONMENT: test
          DBI_DATABASE_URL: postgresql+psycopg://dbi_test_raster@127.0.0.1:5432/dbi_test
          DBI_RASTER_RUN_INTEGRATION: "1"
        run: python .github/scripts/ci_dbi_raster_integration.py
