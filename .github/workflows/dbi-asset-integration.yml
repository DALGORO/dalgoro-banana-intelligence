name: DBI asset integration

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/ci_dbi_asset_*.py"
      - ".github/scripts/ci_dbi_storage_provider_bootstrap.sh"
      - ".github/scripts/ci_dbi_storage_provider_digest.sh"
      - ".github/workflows/dbi-asset-integration.yml"
      - "apps/platform-web/backend/app/api/v1/dbi_assets.py"
      - "apps/platform-web/backend/app/dbi/asset_*.py"
      - "apps/platform-web/backend/app/dbi/storage_*.py"
      - "apps/platform-web/backend/app/dbi/models/assets.py"
      - "apps/platform-web/backend/dbi_alembic/**"
      - "apps/platform-web/backend/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbi-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbi-asset-integration:
    name: DBI · activos en PostGIS + S3 efímeros
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgis:
        image: postgis/postgis:16-3.5@sha256:4be58fcb1b50df187e73536e663149c2b3b2da2a541c2f518cfb6adebc65ed91
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Descargar código
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/platform-web/backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r apps/platform-web/backend/requirements.txt

      - name: Comprobar dependencias
        run: python -m pip check

      - name: Compilar servicios y fixture conjunto
        run: |
          python -m compileall apps/platform-web/backend/app/dbi
          python -m py_compile .github/scripts/ci_dbi_asset_integration.py
          python -m py_compile .github/scripts/ci_dbi_migration_integration.py
          bash -n .github/scripts/ci_dbi_storage_provider_bootstrap.sh

      - name: Aplicar migraciones en PostGIS efímero
        env:
          PYTHONPATH: apps/platform-web/backend
          DBI_ENVIRONMENT: test
          DBI_DATABASE_URL: postgresql+psycopg://dbi_test_migrator@127.0.0.1:5432/dbi_test
        run: python .github/scripts/ci_dbi_migration_integration.py

      - name: Validar digest del proveedor S3
        run: |
          .github/scripts/ci_dbi_storage_provider_digest.sh \
            docker.io/chrislusf/seaweedfs \
            4.29 \
            sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5

      - name: Ejecutar ciclo conjunto con rol mínimo
        env:
          PYTHONPATH: apps/platform-web/backend
          DBI_ENVIRONMENT: test
          DBI_DATABASE_URL: postgresql+psycopg://dbi_test_asset_api@127.0.0.1:5432/dbi_test
          DBI_ASSET_RUN_INTEGRATION: "1"
        run: |
          .github/scripts/ci_dbi_storage_provider_bootstrap.sh \
            docker.io/chrislusf/seaweedfs:4.29@sha256:d47c7ee99fcb951351d7194915f4e3a5ea604a8e8871183d713907dec4fb9bf5
