# ================================================================
# PLANTILLA REUTILIZABLE — ANÁLISIS AUTOMÁTICO DE FINCA BANANERA
# Copie este archivo. No modifique las configuraciones técnicas
# situadas en las secciones parameters, configs y pipeline durante
# la primera ejecución de una finca nueva.
# ================================================================

version: 1

analysis:
  # Nombre que aparecerá en mapas e informe.
  farm_name: NOMBRE_FINCA

  # Nombre del productor, empresa o cliente.
  producer: NOMBRE_PRODUCTOR

  # Autor técnico permanente.
  author: Ing. Darwin A. González Romero

  # null utiliza la fecha del día del procesamiento.
  # También puede escribirse, por ejemplo: 17/07/2026
  report_date: null

  # Use preferentemente barras normales "/" en rutas de Windows.
  orthophoto_path: F:/RUTA/FINCA/ORTOFOTO.tif
  boundary_excel_path: F:/RUTA/FINCA/coordenadas_limite.xls

  # Puede ser el nombre de la hoja o su posición.
  boundary_sheet: Hoja1

  # Densidad definida por el productor o responsable técnico.
  target_density_plants_ha: 1400

  # Modelo YOLO validado.
  model_path: F:/PROY_CONTEO_BANANO_1/runs/detect/banano_v3/weights/best.pt

  # "runs" crea las ejecuciones dentro del proyecto.
  output_root: runs

  # Mantenga ambos valores null cuando no existan exclusiones.
  # Cuando utilice vías, canales o infraestructura:
  # exclusions_gpkg: F:/RUTA/exclusiones.gpkg
  # exclusions_layer: exclusiones
  exclusions_gpkg: null
  exclusions_layer: null

parameters:
  tile_size: 640
  overlap: 128
  min_valid_percent: 0.0
  yolo_confidence: 0.40
  yolo_iou: 0.70
  yolo_imgsz: 640
  yolo_device: auto
  max_detections: 1000
  yolo_limit: null
  deduplication_distance_m: 1.00
  kde_radius_m: null
  kde_pixel_size_m: 0.50

configs:
  spatial_analysis: config/spatial_analysis.yaml
  cartography: config/cartography.yaml
  report: config/report.yaml

pipeline:
  run_system_check: true
  run_boundary_validation: true
